name: Update Etsy gallery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
        env:
          ETSY_KEY: ${{ secrets.ETSY_KEY }}
      - run: |
          git config user.name "linkpage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Update Etsy gallery" && git push)
